# CupAI 前端 Nginx 配置
# 同时支持 IP 访问和 cupai.asia 域名访问，HTTPS 由后续 certbot 注入

# HTTP 服务（同时承载 ACME 验证和 HTTP→HTTPS 重定向）
server {
    listen 80;
    listen [::]:80;
    server_name cupai.asia 154.12.27.86 _;

    # Let's Encrypt ACME 验证目录（certbot --webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查端点
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 站点地图 & robots（SEO 关键文件）
    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # Favicon / OG 图片（强缓存）
    location ~* ^/(favicon|og-cover)\.svg$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "image/svg+xml";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket 代理
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/font-woff2;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cupai.asia _;

    ssl_certificate     /etc/letsencrypt/live/cupai.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cupai.asia/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /robots.txt { root /usr/share/nginx/html; access_log off; add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml { root /usr/share/nginx/html; access_log off; add_header Cache-Control "public, max-age=3600"; add_header Content-Type "application/xml; charset=utf-8"; }
    location ~* ^/(favicon|og-cover)\.svg$ { root /usr/share/nginx/html; expires 30d; add_header Cache-Control "public, immutable"; add_header Content-Type "image/svg+xml"; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ { root /usr/share/nginx/html; expires 30d; add_header Cache-Control "public, immutable"; }
    location / { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://server:3001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; proxy_send_timeout 120s; }
    location /socket.io/ { proxy_pass http://server:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 86400s; proxy_send_timeout 86400s; }
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/font-woff2;
}
